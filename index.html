<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060a" />
  <title>ELEMENT TD — Convergence</title>
  <link rel="stylesheet" href="/src/ui/ui.css" />
  <!-- Multiplayer surfaces keep their own stylesheets rather than growing ui.css
       past 1500 lines. They are loaded unconditionally because both are inert
       until their JS constructs the markup, and a conditional stylesheet is how
       you get a lobby that renders unstyled the first time someone opens it. -->
  <link rel="stylesheet" href="/src/ui/lobby.css" />
  <link rel="stylesheet" href="/src/ui/scoreboard.css" />
  <link rel="stylesheet" href="/src/ui/spectate.css" />
</head>
<body>
  <div id="app">
    <canvas id="viewport"></canvas>
    <div id="ui-root"></div>

    <div id="boot">
      <div class="boot-inner">
        <div class="boot-sigil" aria-hidden="true">
          <span class="boot-ring"></span>
          <span class="boot-ring inner"></span>
          <span class="boot-orbit">
            <i style="--c:#ff5a1f; --a:0deg;   --dl:0s"     >ƒ</i>
            <i style="--c:#2fa8ff; --a:60deg;  --dl:-0.55s" >≈</i>
            <i style="--c:#4fe07a; --a:120deg; --dl:-1.1s"  >❀</i>
            <i style="--c:#c08a4a; --a:180deg; --dl:-1.7s"  >◈</i>
            <i style="--c:#fff2c4; --a:240deg; --dl:-2.25s" >✦</i>
            <i style="--c:#8a4fd6; --a:300deg; --dl:-2.8s"  >●</i>
          </span>
          <span class="boot-core"></span>
        </div>

        <div class="boot-title">ELEMENT&nbsp;TD</div>
        <div class="boot-sub">Convergence</div>
        <div class="boot-rule"></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-status">reading the runes…</div>

        <div class="boot-tip">
          <b>The first law</b>
          Every element you bind unlocks its own tower — and one fusion tower for
          every element you already hold. Six elements. Twenty-one towers.
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
